<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corex Admin sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #0F1F1E; background: #FFFFFF; width: 248px; box-sizing: border-box; padding: 18px 14px 24px; display: flex; flex-direction: column; gap: 28px">

<a href="Main.dc.html" aria-label="Corex Admin dashboard" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px; text-decoration: none">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#0B6A67"></circle><g fill="none" stroke="#FF5A12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h7l5-7h7"></path><path d="M5 20h19"></path><path d="M12 20l5 7h7"></path><circle cx="27" cy="13" r="2.6"></circle><circle cx="27" cy="20" r="2.6"></circle><circle cx="27" cy="27" r="2.6"></circle></g></svg>
<span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #0B6A67">Core<span style="color: #E04A08">X</span></span>
<span style="margin-left: 2px; padding: 2px 7px; border-radius: 6px; background: #E6F2F1; color: #064644; font-size: 11px; font-weight: 700; letter-spacing: 0.06em">ADMIN</span>
</a>

<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" aria-current="{{cur.dashboard}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.dashboard}}; background: {{bg.dashboard}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B6A">Sales</div>
<a href="Leads.dc.html" aria-current="{{cur.leads}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.leads}}; background: {{bg.leads}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"></path></svg>
<span style="flex: 1 1 auto">Leads</span>
<span aria-label="2 new" style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #FF5A12; color: #1B0A02; font-size: 12px; font-weight: 700; text-align: center">2</span></a>
<a href="Clients.dc.html" aria-current="{{cur.clients}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.clients}}; background: {{bg.clients}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V7l7-4 7 4v14"></path><path d="M9 21v-6h6v6"></path></svg>Clients</a>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B6A">Billing</div>
<a href="Subscriptions.dc.html" aria-current="{{cur.subs}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.subs}}; background: {{bg.subs}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
<span style="flex: 1 1 auto">Subscriptions</span>
<span aria-label="1 overdue" style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #FDECEA; color: #A1190F; font-size: 12px; font-weight: 700; text-align: center">1</span></a>
<a href="Invoices.dc.html" aria-current="{{cur.invoices}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.invoices}}; background: {{bg.invoices}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"></path><path d="M14 2v6h6"></path><path d="M9 13h7"></path><path d="M9 17h5"></path></svg>Invoices &amp; receipts</a>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B6A">Admin</div>
<a href="Settings.dc.html" aria-current="{{cur.settings}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.settings}}; background: {{bg.settings}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a>
<a href="ActivityLog.dc.html" aria-current="{{cur.log}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: {{fg.log}}; background: {{bg.log}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2"></path><circle cx="12" cy="12" r="9"></circle></svg>Activity log</a>
<a href="https://your-domain.com" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14.5px; font-weight: 600; text-decoration: none; color: #0F1F1E">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>View website</a>
</div>
</nav>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: #F6FAF9; border: 1px solid #E3ECEB">
<span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #0B6A67; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">A</span>
<span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto">
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Admin name]</span>
<span style="font-size: 12.5px; color: #5B6B6A">Admin</span>
</span>
<a href="Login.dc.html" aria-label="Sign out" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; color: #3C4A49">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","leads","clients","subs","invoices","settings","log"],"default":"dashboard"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const keys = ['dashboard', 'leads', 'clients', 'subs', 'invoices', 'settings', 'log'];
    const cur = {}, fg = {}, bg = {};
    keys.forEach((k) => {
      const on = k === active;
      cur[k] = on ? 'page' : 'false';
      fg[k] = on ? '#064644' : '#0F1F1E';
      bg[k] = on ? '#E6F2F1' : 'transparent';
    });
    return { cur: cur, fg: fg, bg: bg };
  }
}
</script>
</body>
</html>
