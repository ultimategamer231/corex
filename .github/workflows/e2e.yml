name: E2E

# SPEC.md 2: end-to-end tests on main. Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # School (both editions), Finance and Clinic run against local Supabase with fixture schemas
      # (e2e/school/setup.ts, e2e/finance/setup.ts, e2e/clinic/setup.ts).
      - name: Start local Supabase
        run: pnpm db:local:start && pnpm db:local:check

      - name: App environments for the fixture schemas
        run: |
          node scripts/school-env.mjs --schema e2e_school
          node scripts/school-env.mjs --app finance --schema e2e_finance
          node scripts/school-env.mjs --app clinic --schema e2e_clinic

      - name: Build
        run: pnpm build

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
