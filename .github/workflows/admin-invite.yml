name: Admin first invite

# Creates the first Corex Admin account (docs/admin-runbook.md, step 5) without a
# terminal: Actions > Admin first invite > Run workflow. The 72-hour set-up link is
# emailed when RESEND_API_KEY and EMAIL_FROM are set and Resend accepts the address;
# otherwise it is printed in this run's log, so open it straight away (it works once).
# Later admins are invited from Settings > Team. Runs only by hand.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Your full name
        required: true
      username:
        description: A username for signing in (lowercase letters and numbers)
        required: true
      email:
        description: Your email address
        required: true

permissions:
  contents: read

concurrency:
  group: admin-invite
  cancel-in-progress: false

jobs:
  invite:
    name: Invite the first admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_WEB: ${{ secrets.DATABASE_URL_WEB }}
      SUPABASE_URL_WEB: ${{ secrets.SUPABASE_URL_WEB }}
      SUPABASE_SERVICE_ROLE_KEY_WEB: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_WEB }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      # Inputs go through the environment, never into the script text.
      INVITE_NAME: ${{ inputs.name }}
      INVITE_USERNAME: ${{ inputs.username }}
      INVITE_EMAIL: ${{ inputs.email }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for v in DATABASE_URL_WEB SUPABASE_URL_WEB SUPABASE_SERVICE_ROLE_KEY_WEB ADMIN_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these first (docs/admin-runbook.md):$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Invite
        run: |
          pnpm admin:invite --name "$INVITE_NAME" --username "$INVITE_USERNAME" \
            --email "$INVITE_EMAIL" --admin-url "$ADMIN_URL" --project web
