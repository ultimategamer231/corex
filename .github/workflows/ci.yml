name: CI

# SPEC.md 2: lint, typecheck, unit tests and build on every push.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint and typecheck root files
        run: pnpm lint:root && pnpm typecheck:root

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level high

  database:
    name: Database tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supabase images come from Docker Hub (scripts/supabase-local.mjs default):
    # public.ecr.aws rate-limits GitHub-hosted runners ("Data limit exceeded").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:local:start && pnpm db:local:check

      - name: Migrations, access, audit, provisioning, isolation and backup tests
        run: pnpm --filter @corex/db test:db

      - name: Generated database types match the migrations
        run: pnpm db:types && git diff --exit-code packages/db/types
