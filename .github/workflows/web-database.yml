name: Website database

# Creates or updates the website's corex_web schema (leads and rate limits) in the
# website's Supabase project (docs/database.md, "Website leads"). Run by hand after
# adding DATABASE_URL_WEB, and again after a new web migration is merged. It also runs
# twice a week, which applies any pending migration and keeps a free Supabase project
# from pausing after a week without activity.
on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate corex_web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_WEB: ${{ secrets.DATABASE_URL_WEB }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL_WEB" ]; then
            echo "::error::Add the DATABASE_URL_WEB secret first. See docs/database.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate --schema corex_web --product web --project web
