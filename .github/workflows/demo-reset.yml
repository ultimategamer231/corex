name: Demo reset

# SPEC.md 11.5: every night at 02:00 Africa/Monrovia (UTC+0, no daylight saving),
# rebuild each demo schema with its sample data and sign-ins. Talking to the demo
# Supabase project every night also keeps it active. Also runnable by hand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Reset demos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DEMO: ${{ secrets.DATABASE_URL_DEMO }}
      SUPABASE_URL_DEMO: ${{ secrets.SUPABASE_URL_DEMO }}
      SUPABASE_SERVICE_ROLE_KEY_DEMO: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEMO }}
    steps:
      # Until the demo project exists (docs/demos.md), the job reports that and passes.
      - name: Check configuration
        id: config
        run: |
          if [ -n "$DATABASE_URL_DEMO" ] && [ -n "$SUPABASE_URL_DEMO" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY_DEMO" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Demo project secrets are not set; nothing was reset. See docs/demos.md."
          fi

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.config.outputs.ready == 'true'
        name: Install
        run: pnpm install --frozen-lockfile

      - if: steps.config.outputs.ready == 'true'
        name: College demo
        run: pnpm demo:seed --demo college --project demo

      - if: steps.config.outputs.ready == 'true' && !cancelled()
        name: High School demo
        run: pnpm demo:seed --demo highschool --project demo

      - if: steps.config.outputs.ready == 'true' && !cancelled()
        name: Finance demo
        run: pnpm demo:seed --demo finance --project demo

      # GitHub emails the workflow's owner when a scheduled run fails; the team email
      # notification is added with the email provider (PROGRESS.md, deferred).
      - if: failure()
        name: Report failure
        run: echo "::error::A demo reset failed. The demo keeps yesterday's data until the next successful run."
