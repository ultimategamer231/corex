packages:
  - apps/*
  - packages/*

catalog:
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/jest-dom": 6.10.0
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  jsdom: 29.1.1
  lucide-react: 1.61.0
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vitest: 4.1.12

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - supabase
  - unrs-resolver

# Patched versions of transitive dependencies flagged by `pnpm audit`.
overrides:
  zod: 4.6.7

# Advisories with no fixed release yet, reached only by tooling that never runs in the
# apps (accepted by the owner on 18 November 2026; docs/audits/security-scan-2026-11.md,
# finding 6). Remove each entry as soon as a fixed version is published.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS: used by ESLint and Vitest to match our own file patterns.
    - GHSA-fc5q-39xc-vjpf
