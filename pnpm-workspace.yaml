packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - supabase
  - unrs-resolver

# Shared versions. Workspace packages reference these with "catalog:".
catalog:
  next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 22.20.5
  typescript: 6.0.3
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  lucide-react: 1.61.0
  vitest: 4.1.12
  jsdom: 30.1.3
  "@testing-library/react": 16.3.3
  "@testing-library/jest-dom": 6.10.0
  "@testing-library/user-event": 14.6.8
